[project]
name = "auto_finance_origination"
version = "0.1.0"
description = "auto_finance_origination using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "boto3>=1.43.15",
    "crewai[tools]==1.14.5a2",
    "streamlit>=1.57.0",
]

[project.scripts]
auto_finance_origination = "auto_finance_origination.main:run"
run_crew = "auto_finance_origination.main:run"
train = "auto_finance_origination.main:train"
replay = "auto_finance_origination.main:replay"
test = "auto_finance_origination.main:test"
run_with_trigger = "auto_finance_origination.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
